<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1200" fill="#FAFAF8"/>
  
  <!-- MARK ONLY VERSION - Logo symbol standalone -->
  <!-- For favicon, app icon, small applications -->
  
  <g transform="translate(600, 600)">
    <!-- Outer geometric frame -->
    <g stroke="#1a3a3a" stroke-width="8" fill="none">
      <path d="M 0,-220 L 220,-68 L 135,175 L -135,175 L -220,-68 Z" stroke="#1a3a3a" stroke-width="6"/>
    </g>
    
    <!-- Left side: Mountain/Terrain geometry -->
    <g fill="#1a3a3a">
      <polygon points="-104,-147 -55,-24 -12,-74 30,-6 61,-98" fill="#1a3a3a"/>
      <line x1="-98" y1="-122" x2="-61" y2="-49" stroke="#1a3a3a" stroke-width="2"/>
      <line x1="-61" y1="-49" x2="-18" y2="-86" stroke="#1a3a3a" stroke-width="2"/>
    </g>
    
    <!-- Center: Strong Industrial Hexagon -->
    <g fill="#1a3a3a">
      <polygon points="0,-61 55,-31 55,31 0,61 -55,31 -55,-31" fill="#1a3a3a"/>
      <polygon points="0,-37 33,-18 33,18 0,37 -33,18 -33,-18" fill="#FAFAF8"/>
    </g>
    
    <!-- Right side: Growth and Forward Movement -->
    <g fill="#1a3a3a">
      <polygon points="92,-98 147,-61 122,-12 85,-43" fill="#1a3a3a"/>
      <polygon points="110,-73 159,-43 141,6 98,-18" fill="#1a3a3a" opacity="0.85"/>
    </g>
    
    <!-- Connecting geometric elements -->
    <g stroke="#1a3a3a" stroke-width="1.5" fill="none">
      <line x1="-61" y1="-49" x2="-55" y2="-31"/>
      <line x1="30" y1="-6" x2="55" y2="-31"/>
      <line x1="85" y1="-43" x2="55" y2="-31"/>
    </g>
    
    <!-- Outer circle frame -->
    <circle cx="0" cy="0" r="196" fill="none" stroke="#1a3a3a" stroke-width="5"/>
  </g>
</svg>
